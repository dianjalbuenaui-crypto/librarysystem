    <div class="wt-captions" aria-live="polite">
      <div class="wt-caption{{ '' if on_admin else ' is-current' }}" data-role="user">
        <h2>For borrowers</h2>
        <p>Browse the catalog, request a book, and pick it up once a librarian approves it.</p>
      </div>
      <div class="wt-caption{{ ' is-current' if on_admin else '' }}" data-role="admin">
        <h2>For admins</h2>
        <p>Keep the catalog up to date, approve borrow requests, and check books back in.</p>
      </div>
    </div>

    <div class="wt-dots">
      <button type="button" class="wt-dot" data-role="user" aria-current="{{ 'false' if on_admin else 'true' }}" aria-label="Borrower"></button>
      <button type="button" class="wt-dot" data-role="admin" aria-current="{{ 'true' if on_admin else 'false' }}" aria-label="Admin"></button>
    </div>
  </div>
